[defaults]
# Inventory file
inventory = terraform_inventory.py

# Disable host key checking for dynamic cloud environments
host_key_checking = False

# SSH connection settings
remote_user = root
private_key_file = ~/.ssh/digitalocean-terraform

# Output formatting
stdout_callback = ansible.builtin.default
result_format = yaml
callbacks_enabled = timer, profile_tasks

# Reduce SSH connection warnings
deprecation_warnings = False

# Retry files location
retry_files_enabled = False

# Increase connection timeout for cloud instances
timeout = 30

[ssh_connection]
# SSH arguments
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes

# Enable pipelining for faster execution
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
